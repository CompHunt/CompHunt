<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CompHunt — Discover opportunities that match your interests</title>
<meta name="description" content="CompHunt helps high school students discover competitions, scholarships, research programs, internships, and more — personalized to their interests, budget, and time." />
<script>
  (function () {
    try {
      var stored = localStorage.getItem('oh_theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="logos.js"></script>
<script src="app.js"></script>
</body>
</html>
